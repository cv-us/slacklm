# Channel-to-Notebook Mapping
#
# Map Slack channel IDs to NotebookLM notebook IDs.
# To find your channel ID: right-click channel name → View channel details → scroll to bottom.
# To find your notebook ID: it's the UUID in the NotebookLM URL:
#   https://notebooklm.google.com/notebook/<notebook-id>

channels:
  # Example: map a specific channel to a specific notebook
  # C0123456789:
  #   notebook_id: "1395e9ba-90ba-45b0-a435-761f0e4ce313"
  #   name: "Engineering Docs"

  # Default notebook used when a channel has no specific mapping
  default:
    notebook_id: "1395e9ba-90ba-45b0-a435-761f0e4ce313"
    name: "Default Notebook"

# Claude fallback settings (used when NotebookLM chat.ask() fails)
claude_fallback:
  enabled: true
  model: "claude-sonnet-4-6"

# How the bot replies to @mentions in channels:
#   thread  - reply in a thread under the user's message (default)
#   channel - post the answer as a regular top-level channel message
reply_style: thread

# When true, replies inside a thread the bot has answered in are
# auto-answered without needing another @mention. Off by default so only
# explicit @mentions (and DMs) trigger the bot and consume usage.
# Enabling this also requires the message.channels event subscription and
# channels:history scope on the Slack app.
auto_thread_replies: false
