[project]
name = "slacklm"
version = "0.1.0"
description = "Slack bot that queries NotebookLM notebooks to answer questions from PDF sources"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.20.0",
    "slack-sdk>=3.30.0",
    "aiohttp>=3.9.0",
    # [headless] provides gpsoauth for master-token auth: with a
    # master_token.json beside storage_state.json, the client silently
    # re-mints a fresh cookie session server-side whenever auth dies.
    "notebooklm-py[browser,headless]>=0.8.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
